<!doctype html>
<html class="h-full w-full">

<head>
  <title>{{ .Title }}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="text/javascript">
    function setDefaultThemeValue() {
      console.log(this)
      this.checked = (localStorage.theme === "dark" ||
        (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) ? 1 : 0;
    }

  </script>
  <script src="/assets/htmx.js"></script>
  <script src="/assets/tailwind.js"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (:root:has(input.theme-controller[value=dark]:checked), [data-theme=dark] *);
  </style>
  <link rel="stylesheet" href="/assets/daisyui.css" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0/themes.css" rel="stylesheet" type="text/css" />
</head>

<body class="w-full h-full dark:bg-slate-900 bg-slate-200">
  {{ template "content" . }}
</body>

</html>
