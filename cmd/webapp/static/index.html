<!doctype html>
<html class="h-full w-full">

<head>
  <title>{{ .Title }}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="text/javascript">
    function setDefaultThemeValue() {
      console.log(this)
      this.checked = (localStorage.theme === "dark" ||
        (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme: dark)").matches)) ? 1 : 0;
    }

  </script>
  <script src="/static/htmx.js"></script>
  <script src="/static/tailwind.js"></script>
  <link rel="stylesheet" href="/static/daisyui.css" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0/themes.css" rel="stylesheet" type="text/css" />
</head>

<body class="w-full h-full bg-base-200">
  {{ template "content" . }}
</body>

</html>
